name: cico_project
description: "Aplikasi driver untuk Check-In / Check-Out pool kendaraan."
publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  get: ^4.6.6

  # Firebase
  firebase_core: ^3.13.1
  firebase_crashlytics: ^4.3.4

  # biometric authentication
  local_auth: ^2.3.0

  # geolocation
  geolocator: ^10.1.0
  geocoding: ^2.0.5

  dio: ^5.9.0
  get_storage: ^2.1.1
  flutter_swipe_button: ^2.1.3

  webview_flutter: ^4.7.0
  intl: ^0.19.0
  gal: ^2.3.0
  package_info_plus: ^8.0.0
  # google_fonts: ^6.2.1  # fonts now bundled as assets

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/app_icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/app_icon.png"

flutter:
  uses-material-design: true

  # Assets
  assets:
    - assets/images/logo.png
    - assets/images/success_icon.png
    - assets/images/reject_icon.png
    - assets/images/waiting_for_payment.png

  # Fonts
  fonts:
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-VariableFont_wght.ttf
    - family: HankenGrotesk
      fonts:
        - asset: assets/fonts/HankenGrotesk-VariableFont_wght.ttf
        - asset: assets/fonts/HankenGrotesk-Italic-VariableFont_wght.ttf
          style: italic
